[supervisord]
nodaemon=true
logfile=/dev/null
loglevel=info
pidfile=/tmp/supervisord.pid

[program:fastify]
command=node dist-server/server.js
directory=/app
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORTINT="3001"

[program:nginx]
command=nginx -g 'daemon off;'
directory=/app
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
