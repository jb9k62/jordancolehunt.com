# Security headers for static responses that are legitimately embedded
# on the same origin (e.g. the CV PDF rendered inside an <object> on /cv/).
# Uses X-Frame-Options SAMEORIGIN instead of DENY so same-origin embeds
# work while cross-origin framing remains blocked.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
