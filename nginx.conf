# ============================================================================
# Nginx — static site + proxy for the Fastify contact endpoint
# Runtime: node:20-alpine with nginx + nginx-mod-http-brotli + supervisor
# ============================================================================

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

# The supervisor runs as a non-root user, so nginx master + workers share that
# user (no root setuid). Remove the root-only `user` directive.
# user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  etag on;

  # Writable temp paths for non-root operation (defaults point at /var/lib/nginx, root-owned)
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Logging (to stdout/stderr so the supervisor captures it, writable as non-root)
  access_log /dev/stdout combined;

  # ---------- Compression ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/html
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  brotli on;
  brotli_comp_level 6;
  brotli_types
    text/plain
    text/css
    text/html
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name jordancolehunt.com;

    # Emit relative redirects (no scheme/port baked in) so directory-index
    # redirects don't leak the internal :8080 port / http scheme past Fly TLS.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /app/dist-site;
    index index.html;

    # Serve the 404 page with the correct 404 status for unknown paths
    error_page 404 /404.html;

    # ---------- Immutable hashed assets (css/js) ----------
    location ~* ^/styles/.+\.css$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Vary "Accept-Encoding" always;
      try_files $uri =404;
    }

    location ~* ^/js/.+\.js$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Vary "Accept-Encoding" always;
      try_files $uri =404;
    }

    # ---------- Images / fonts / pdf (unversioned -> short cache, not immutable) ----------
    location ~* \.(png|jpe?g|gif|webp|svg|woff2?|pdf)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    # favicon
    location = /favicon.svg {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    # ---------- API proxy -> Fastify on 127.0.0.1:3001 ----------
    location ^~ /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    location = /healthz {
      proxy_pass http://127.0.0.1:3001/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # ---------- HTML (no-cache at browser, SWR in CDN; 404 -> 404.html w/ proper status) ----------
    location ~* \.html$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header CDN-Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
      add_header Vary "Accept-Encoding" always;
      try_files $uri $uri/ =404;
    }

    # ---------- Default / clean URLs + 404 ----------
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header CDN-Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
      add_header Vary "Accept-Encoding" always;
      # Real blog files exist (blog/<slug>/index.html), so no rewrite needed.
      # Unknown paths fall through to error_page 404 -> 404.html (status 404).
      try_files $uri $uri/ =404;
    }

    # sitemap / robots (revalidate like HTML)
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header CDN-Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }
  }
}
